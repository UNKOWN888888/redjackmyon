name: Verify userscript

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify generated userscript and regressions
        run: npm run verify
      - name: Ensure the committed build is current
        run: git diff --exit-code -- dist/blackjackT.user.js
